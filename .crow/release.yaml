when:
  - event: manual
    branch: ${CI_REPO_DEFAULT_BRANCH}

variables:
  RELEASE_VERSION:
    description: 'Publish the reviewed stable version, for example v0.2.3'
    required: true
    default: ''

steps:
  - name: checks
    image: &python_image 'ghcr.io/astral-sh/uv:0.13.8-python3.11-trixie-slim@sha256:7a0b97c592d27e887e0bb9be01c45135c8f0fc00719faa19ec1f8cbcc73d9b69'
    environment:
      UV_LINK_MODE: copy
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git
      - uv sync --locked
      - SKIP=no-commit-to-branch uv run --locked --offline prek run --all-files --stage manual

  - name: prepare-manual-release
    image: *python_image
    depends_on: [checks]
    commands:
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - python scripts/release.py prepare-manual

  - name: create-release-tag
    image: *python_image
    depends_on: [prepare-manual-release]
    environment:
      GITHUB_RELEASE_TOKEN:
        from_secret: github_release_token  # pragma: allowlist secret
    commands:
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
      - python scripts/release.py create-tag
