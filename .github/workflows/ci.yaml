name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install frozen development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run hooks and offline contract tests
        run: prek run --all-files --stage manual --show-diff-on-failure
      - name: Validate new commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message_file=$(mktemp)
          trap 'rm -f "$message_file"' EXIT
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git show -s --format=%B "$commit" > "$message_file"
            prek run conventional-pre-commit --stage commit-msg --commit-msg-filename "$message_file"
          done
