[project]
name = "hermes-omniroute-dev"
version = "0.0.0"
description = "Development tooling for the native Hermes OmniRoute plugins"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "prek>=0.5.10,<0.6",
    "pytest>=9.2.0,<10",
    "requests>=2.34.2,<3",
]

[tool.uv]
package = false
required-version = ">=0.13.8"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
